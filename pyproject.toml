[project]
name = "kuji"
version = "2.2.0"
description = "库集（KuJi）— Steam 游戏库分类工具（单文件桌面应用）"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/sandbox", ".venv", "dist", "build"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
